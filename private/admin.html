<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Inventaire - Stock Peinture</title>
</head>
<body>
    <header>
        <figure id="banniere">
            <img src="/assets/images/Photo_Locaux_Entreprise_GG2.png" alt="Entrepôt de l'entreprise">
        </figure>
        <h1>Inventaire</h1>
        <nav>
            <a href="/admin/historique">Historique des mouvements</a> |
            <a href="/admin/utilisateurs">Utilisateurs</a> |
            <a href="/scan.html">Scan</a>
        </nav>
        <button type="button" id="deconnexion">Déconnexion</button>
    </header>

    <main>
        <details id="section-article">
            <summary id="titre-form">Ajouter un article</summary>
            <form id="form-article" class="formulaire-article">
            <label for="a-code">Code-barre
                <input type="text" id="a-code" name="code_barre" maxlength="30" required autocomplete="off" autocapitalize="characters">
            </label>
            <p id="aide-code" role="status"></p>
            <label for="a-nom">Nom
                <input type="text" id="a-nom" name="nom" maxlength="100" required list="l-nom">
            </label>
            <label for="a-couleur">Couleur
                <input type="text" id="a-couleur" name="couleur" maxlength="100" required list="l-couleur">
            </label>
            <label for="a-finition">Finition
                <input type="text" id="a-finition" name="finition" maxlength="100" required list="l-finition">
            </label>
            <label for="a-texture">Texture
                <input type="text" id="a-texture" name="texture" maxlength="100" required list="l-texture">
            </label>
            <label for="a-fabricant">Fabricant
                <input type="text" id="a-fabricant" name="fabricant" maxlength="100" required list="l-fabricant">
            </label>
            <label for="a-prix">Prix unitaire (€)
                <input type="text" id="a-prix" name="prix" inputmode="decimal"
                    pattern="\d{1,7}([.,]\d{1,2})?" placeholder="ex. 12,50">
            </label>
            <datalist id="l-nom"></datalist>
            <datalist id="l-couleur"></datalist>
            <datalist id="l-finition"></datalist>
            <datalist id="l-fabricant"></datalist>
            <datalist id="l-texture"></datalist>
            <label for="a-stock" id="label-stock">Stock initial
                <input type="number" id="a-stock" name="stock_initial" min="0" step="1" value="0">
            </label>
            <div class="actions">
                <button type="submit" id="btn-enregistrer">Ajouter</button>
                <button type="button" id="btn-annuler" hidden>Annuler la modification</button>
            </div>
            </form>
        </details>

        <p id="message" role="alert"></p>

        <section id="section-inventaire">
            <h2>Stock</h2>
            <form id="filtres">
                <label>Nom <input type="search" data-filtre="nom"></label>
                <label>Couleur <input type="search" data-filtre="couleur"></label>
                <label>Finition <input type="search" data-filtre="finition"></label>
                <label>Texture <input type="search" data-filtre="texture"></label>
                <label>Fabricant <input type="search" data-filtre="fabricant"></label>
                <label>Statut
                    <select data-filtre="statut">
                        <option value="">Articles actifs</option>
                        <option value="archives">Articles archivés</option>
                        <option value="verifier">À vérifier</option>
                    </select>
                </label>
                <button type="reset" id="raz">Réinitialiser</button>
            </form>

            <div class="tableau-conteneur">
                <table>
                    <thead>
                        <tr>
                            <th aria-sort="ascending"><button type="button" data-tri="nom">Nom</button></th>
                            <th aria-sort="none"><button type="button" data-tri="couleur">Couleur</button></th>
                            <th aria-sort="none"><button type="button" data-tri="finition">Finition</button></th>
                            <th aria-sort="none"><button type="button" data-tri="texture">Texture</button></th>
                            <th aria-sort="none"><button type="button" data-tri="fabricant">Fabricant</button></th>
                            <th>Code-barre</th>
                            <th aria-sort="none"><button type="button" data-tri="quantite">Quantité</button></th>
                            <th aria-sort="none"><button type="button" data-tri="prix">Prix unitaire</button></th>
                            <th aria-sort="none"><button type="button" data-tri="valeur">Valeur</button></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="corps"></tbody>
                </table>
            </div>
            <p id="compteur" role="status"></p>
            <p id="valorisation" role="status"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="/js/csrf.js" defer></script>
    <script src="/js/admin.js" defer></script>
</body>
</html>
