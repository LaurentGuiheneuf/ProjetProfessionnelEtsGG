<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/assets/css/style.css">
    <title>Inventaire – Stock Peinture</title>
</head>
<body>
    <header>
        <h1>Inventaire</h1>
        <button type="button" id="deconnexion">Déconnexion</button>
    </header>

    <main>
        <form id="filtres">
            <label>Nom <input type="search" data-filtre="nom"></label>
            <label>Couleur <input type="search" data-filtre="couleur"></label>
            <label>Finition <input type="search" data-filtre="finition"></label>
            <label>Fabricant <input type="search" data-filtre="fabricant"></label>
            <button type="reset" id="raz">Réinitialiser</button>
        </form>

        <div class="tableau-conteneur">
            <table>
                <thead>
                    <tr>
                        <th aria-sort="ascending"><button type="button" data-tri="nom">Nom</button></th>
                        <th aria-sort="none"><button type="button" data-tri="couleur">Couleur</button></th>
                        <th aria-sort="none"><button type="button" data-tri="finition">Finition</button></th>
                        <th aria-sort="none"><button type="button" data-tri="fabricant">Fabricant</button></th>
                        <th>Code-barre</th>
                        <th>Quantité</th>
                    </tr>
                </thead>
                <tbody id="corps"></tbody>
            </table>
        </div>
        <p id="compteur" role="status"></p>
    </main>

    <script src="../public/js/admin.js" defer></script>
</body>
</html>
