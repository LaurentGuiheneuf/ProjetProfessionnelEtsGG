<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="./js/login.js" defer></script>
    
    <title>Ets Guihéneuf-Gicquiaud Peinture</title>
</head>
<body>
    <header>
        <figure id="banniere">
            <img src="./images/Banniere_Locaux_Entreprise_GG.png" alt="Entrepôt de l'entreprise">
        </figure>
        <h1>Application Stock Peinture</h1>
    </header>

    <main>
        <section id="identification">
            <h2>Identifiez-vous</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Connexion</legend>
                    <p>
                        <label for="utilisateur">Utilisateur :</label>
                        <input type="text" id="utilisateur" name="utilisateur"
                               autocomplete="username" required>
                    </p>
                    <p>
                        <label for="mdp">Mot de passe :</label>
                        <input type="password" id="mdp" name="password"
                               autocomplete="current-password" required>
                    </p>
<!--                   <p><a href="#">Mot de passe oublié</a></p>                  -->
                    <button type="submit">Valider</button>
                </fieldset>
            </form>
        </section>

        <figure id="bas-page">
            <img src="./images/Sablage.png" alt="Sablage">
            <img src="./images/Metallisation.png" alt="Métallisation">
            <img src="./images/Peinture_liquide.png" alt="Peinture Liquide">
            <img src="./images/Peinture_poudre.png" alt="Peinture Liquide">
            
        </figure>
    </main>

    <footer>
        <h5>Ets Guihéneuf-Gicquiaud</h5>
        <h5>Mentions légales</h5>
    
    </footer>
</body>
</html>
