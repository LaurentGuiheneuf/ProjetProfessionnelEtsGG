<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/style.css">
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></script>   
    <script src="./js/login.js" defer></script>
    
    <title>Ets Guihéneuf-Gicquiaud Peinture</title>
</head>
<body>
    <header>
        <figure id="banniere">
            <img src="/assets/images/Photo_Locaux_Entreprise_GG2.png" alt="Entrepôt de l'entreprise">
        </figure>
        <h1>Application Stock Peinture</h1>
    </header>

    <main>
        <section id="identification">
            <h2>Identifiez-vous</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Connexion</legend>
                    <p>
                        <label for="utilisateur">Utilisateur :</label>
                        <input type="text" id="utilisateur" name="utilisateur"
                               autocomplete="username" required>
                    </p>
                    <p>
                        <label for="mdp">Mot de passe :</label>
                        <input type="password" id="mdp" name="password"
                               autocomplete="current-password" required>
                    </p>
<!--                   <p><a href="#">Mot de passe oublié</a></p>                  -->
                    <button type="submit">Valider</button>
                </fieldset>
            </form>
        </section>

        <figure id="bas-page">
            <img src="/assets/images/Sablage.png" alt="Sablage" width="150" height="150">
            <img src="/assets/images/Metallisation.png" alt="Métallisation" width="150" height="150">
            <img src="/assets/images/Peinture_liquide.png" alt="Peinture Liquide" width="150" height="150">
            <img src="/assets/images/Peinture_poudre.png" alt="Peinture Poudre" width="150" height="150">
        </figure>
    </main>

    <footer>
        <h3>Ets Guihéneuf-Gicquiaud</h3>
        <h3>Mentions légales</h3>
    
    </footer>
</body>
</html>
